<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Authenticator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Using a sleek, modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #eef2ff; /* Very light indigo background */
        }
        .card {
            box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.1), 0 5px 15px -5px rgba(0, 0, 0, 0.06);
            transition: all 0.3s;
        }
        .result-box {
            border-left: 6px solid;
            padding: 20px;
            border-radius: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* Color Palette */
        .real-border { border-color: #10B981; } /* Emerald Green */
        .fake-border { border-color: #EF4444; } /* Red */
        .unknown-border { border-color: #6B7280; } /* Gray */
        .real-text { color: #059669; } /* Darker Emerald */
        .fake-text { color: #B91C1C; } /* Darker Red */
        .unknown-text { color: #4B5563; } /* Darker Gray */
        
        /* Loading Spinner */
        .loading-animation {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #4F46E5; /* Indigo-600 */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex justify-center items-start">

    <div class="w-full max-w-3xl mt-12">
        <!-- Main Card -->
        <div class="card bg-white p-8 md:p-12 rounded-2xl">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-3">AI News Authenticator</h1>
            <p class="text-center text-gray-500 mb-8 text-lg">Determine the linguistic style (Real vs. Fake) of an article.</p>

            <!-- Input Area -->
            <label for="news-text" class="block text-sm font-medium text-gray-700 mb-2">Paste Article Content</label>
            <textarea id="news-text" rows="8" class="w-full border border-gray-300 rounded-xl p-4 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out resize-none" placeholder="E.g., 'WASHINGTON (Reuters) - U.S. consumer spending increased 0.5% in October...'"></textarea>
            
            <!-- Analyze Button -->
            <button id="analyze-btn" onclick="analyzeNews()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 mt-5 rounded-xl transition duration-150 ease-in-out flex items-center justify-center shadow-lg hover:shadow-xl">
                <span id="button-text">Analyze News</span>
                <span id="loading-spinner" class="loading-animation hidden ml-3"></span>
            </button>
            
            <!-- Result Display -->
            <div id="result-container" class="mt-10 hidden">
                <div id="prediction-box" class="result-box bg-gray-50">
                    <div>
                        <p class="text-sm font-medium text-gray-600 mb-1">Model Prediction</p>
                        <h2 id="prediction-label" class="text-3xl font-bold"></h2>
                    </div>
                    <div class="text-right">
                         <p class="text-sm font-medium text-gray-600 mb-1">Confidence</p>
                        <p id="confidence-score" class="text-3xl font-bold"></p>
                    </div>
                </div>
            </div>
            
            <!-- Error Message -->
            <div id="error-message" class="mt-8 hidden p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-lg">
                <p class="font-semibold">Analysis Failed</p>
                <p id="error-text" class="text-sm"></p>
            </div>

        </div>
    </div>

    <script>
        async function analyzeNews() {
            const newsText = document.getElementById('news-text').value;
            const resultContainer = document.getElementById('result-container');
            const errorContainer = document.getElementById('error-message');
            const buttonText = document.getElementById('button-text');
            const loadingSpinner = document.getElementById('loading-spinner');
            const analyzeBtn = document.getElementById('analyze-btn');

            // --- UI State: Loading ---
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            analyzeBtn.disabled = true;
            buttonText.textContent = 'Analyzing...';
            loadingSpinner.classList.remove('hidden');

            if (!newsText.trim()) {
                document.getElementById('error-text').textContent = 'Please enter some text to analyze.';
                errorContainer.classList.remove('hidden');
                analyzeBtn.disabled = false;
                buttonText.textContent = 'Analyze News';
                loadingSpinner.classList.add('hidden');
                return;
            }

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: newsText })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || `HTTP error! status: ${response.status}`);
                }

                displayResults(data);

            } catch (error) {
                console.error('Prediction error:', error);
                document.getElementById('error-text').textContent = `Could not analyze text. Reason: ${error.message}`;
                errorContainer.classList.remove('hidden');
            } finally {
                // --- UI State: Finished ---
                analyzeBtn.disabled = false;
                buttonText.textContent = 'Analyze News';
                loadingSpinner.classList.add('hidden');
            }
        }

        function displayResults(data) {
            const predictionLabel = document.getElementById('prediction-label');
            const confidenceScore = document.getElementById('confidence-score');
            const predictionBox = document.getElementById('prediction-box');
            const resultContainer = document.getElementById('result-container');

            const prediction = data.prediction;
            // FIX: Ensure confidence is treated as a number before calling toFixed()
            const confidence = parseFloat(data.confidence || 0).toFixed(2);
            
            predictionLabel.textContent = prediction;
            confidenceScore.textContent = `${confidence}%`;

            // Clear previous classes
            predictionBox.className = 'result-box bg-gray-50';
            predictionLabel.className = 'text-3xl font-bold';

            // Apply new styling based on prediction
            if (prediction === 'REAL NEWS') {
                predictionBox.classList.add('real-border', 'bg-emerald-50');
                predictionLabel.classList.add('real-text');
                confidenceScore.classList.add('real-text');
            } else if (prediction === 'FAKE NEWS') {
                predictionBox.classList.add('fake-border', 'bg-red-50');
                predictionLabel.classList.add('fake-text');
                confidenceScore.classList.add('fake-text');
            } else {
                predictionBox.classList.add('unknown-border');
                predictionLabel.classList.add('unknown-text');
                confidenceScore.classList.add('unknown-text');
            }

            resultContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
