services:
  - type: web
    name: fake-news-detector
    env: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      if [ ! -f data/Fake.csv ] || [ ! -f data/True.csv ]; then
        python prepare_liar_data.py --half-true drop
      fi
      python training/train_models.py --fake-path data/Fake.csv --true-path data/True.csv --models-dir models
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ANALYTICS_LOG_PATH
        value: /tmp/prediction_logs.jsonl
