services:
  - type: web
    name: fake-news-detector
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ANALYTICS_LOG_PATH
        value: /tmp/prediction_logs.jsonl
      - key: ENABLE_SHAP
        value: "0"
      - key: ENABLE_LIME
        value: "0"
      - key: MAX_INPUT_CHARS
        value: "30000"
